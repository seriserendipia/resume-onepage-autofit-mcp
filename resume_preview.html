<!DOCTYPE html>
<html lang="zh-cn">
<head>
  <meta charset="UTF-8">
  <title>Resume Preview (Native CSS)</title>
  <style>
    /* 
     * @page 规则：Paged.js 会解析 margin 并转换为 --pagedjs-margin-* 变量
     * 注意：CSS 变量在 @page 规则中可能不被正确解析，所以使用默认固定值
     * 实际的 margin 值由 resume_renderer.js 的 ensureA4PageRule() 动态设置
     */
    @page {
      size: A4;
      margin: 7mm; /* Default, will be overridden by ensureA4PageRule */
    }

    /* Bundled body typeface (SIL OFL 1.1, see fonts/OFL.txt).
       Static instances on purpose: Chromium embeds variable fonts in PDFs as
       Type 3 (unhinted, poorly handled by some viewers/ATS); static TrueType
       is embedded as a regular CID font. */
    @font-face {
      font-family: 'Source Sans 3';
      font-style: normal; font-weight: 400;
      src: url('fonts/SourceSans3-Regular.woff2') format('woff2');
    }
    @font-face {
      font-family: 'Source Sans 3';
      font-style: italic; font-weight: 400;
      src: url('fonts/SourceSans3-It.woff2') format('woff2');
    }
    @font-face {
      font-family: 'Source Sans 3';
      font-style: normal; font-weight: 600;
      src: url('fonts/SourceSans3-Semibold.woff2') format('woff2');
    }
    @font-face {
      font-family: 'Source Sans 3';
      font-style: italic; font-weight: 600;
      src: url('fonts/SourceSans3-SemiboldIt.woff2') format('woff2');
    }
    @font-face {
      font-family: 'Source Sans 3';
      font-style: normal; font-weight: 700;
      src: url('fonts/SourceSans3-Bold.woff2') format('woff2');
    }
    @font-face {
      font-family: 'Source Sans 3';
      font-style: italic; font-weight: 700;
      src: url('fonts/SourceSans3-BoldIt.woff2') format('woff2');
    }

    /* Reset & Base */
    body {
      margin: 0;
      padding: 0;
      background-color: #f0f2f5; 
      font-family: sans-serif;
      overflow-x: hidden;
      display: flex;
      justify-content: center;
      padding: 20px;
    }

    /* A4 Page Container */
    .page {
      background: white;
      width: 210mm;
      min-height: 297mm;
      padding: var(--page-margin, 0mm); /* sentinel: 0mm = JS failed to load */
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      position: relative;
      box-sizing: border-box;
      font-size: var(--body-font-size, 99pt); /* sentinel: 99pt = JS failed to load */
    }

    /* Inside Paged.js pages the @page margin is the ONLY margin. Without this
       the container padding stacked on top of it and the real margin was 2×
       --page-margin. */
    .pagedjs_page .page {
      width: auto;
      min-height: 0;
      padding: 0 !important;
      box-shadow: none;
    }

    /* Prevent breaking inside elements */
    h1, h2, h3, h4, h5, h6, li, p, td, tr {
        break-inside: avoid;
    }
    
    /* ------------------------------------------------------------------
     * Typography & vertical rhythm
     *
     * --u is the baseline unit: one line of body text (size × leading).
     * Every vertical gap is a multiple of --u, NOT of the local font-size,
     * so spacing stays on one rhythm whatever the heading size is, and the
     * proximity hierarchy is explicit:
     *     section gap  >  entry gap  >  bullet gap
     * Line-height is set per ROLE (body / heading / name) instead of one
     * ratio scaled everywhere: bigger type needs proportionally less leading.
     * ------------------------------------------------------------------ */
    :root {
      --u: calc(var(--body-font-size) * var(--line-height));
    }

    .page {
      font-family: var(--font-family, sans-serif);
      line-height: var(--line-height);
      font-kerning: normal;
      font-variant-ligatures: common-ligatures;
      font-variant-numeric: lining-nums proportional-nums;
      color: #1a1a1a;
    }

    h1 {
      font-size: calc(var(--body-font-size) * var(--heading-scale) * 1.6);
      font-weight: 700;
      letter-spacing: -0.01em;
      text-align: center;
      margin: 0 0 calc(var(--u) * 0.15);
      line-height: 1.1;
    }

    /* Contact info line right after the name should be centered */
    h1 + p {
      text-align: center;
    }

    h2 {
      font-size: calc(var(--body-font-size) * var(--heading-scale));
      font-weight: 700;
      letter-spacing: 0.04em;
      /* more space above than below: the heading belongs to what follows */
      margin: calc(var(--u) * var(--title-hr-margin)) 0 calc(var(--u) * 0.3);
      line-height: 1.2;
      border-bottom: 0.75pt solid #b0b0b0;
      padding-bottom: 0.1em;
    }

    h3, h4, h5, h6 {
      font-size: calc(var(--body-font-size) * var(--heading-scale));
      font-weight: 600;
      margin: calc(var(--u) * var(--body-margin)) 0 0;
      line-height: 1.2;
    }

    hr {
      margin: calc(var(--u) * var(--title-hr-margin) * 0.5) 0;
      border: 0;
      border-top: 0.75pt solid #b0b0b0;
    }

    p, li, div {
        line-height: var(--line-height);
    }

    /* Entry gap: space before a paragraph / entry header */
    p {
      margin: calc(var(--u) * (var(--body-margin) + var(--entry-extra, 0))) 0 0;
      overflow: hidden; /* clearfix for floated date elements */
    }

    /* Entry headers (tagged by resume_renderer.js) get an extra step on top of
       the entry gap, so entries can be set apart without loosening ordinary
       paragraphs. Done through a variable rather than a margin rule: paged.js
       hoists every sibling (+) rule above the stylesheet, so a class-level
       margin here would beat the "margin-top: 0" overrides below. */
    .entry-header {
      --entry-extra: var(--strong-paragraph-margin, 0);
    }

    /* First block under a section heading sits right below the rule */
    h1 + p, h2 + p, h2 + ul, h2 + ol {
      margin-top: 0;
    }

    /* Bullet gap: header→first bullet and bullet→bullet share one small step */
    ul, ol {
      padding-left: 1.25em;
      margin: calc(var(--u) * var(--ul-margin)) 0 0;
    }

    li {
      margin: 0;
      padding-left: 0.1em;
    }

    li + li {
      margin-top: calc(var(--u) * var(--ul-margin));
    }

    /* Loose markdown lists wrap each item in a <p>; without this its entry gap
       collapses through the <li> and overrides the bullet gap. */
    li > p {
      margin: 0;
    }

    strong {
      font-weight: 600;
    }

    /* 
     * Bold-first paragraphs (e.g., "**Company** · Title") get top margin
     * via the parent <p> when its first child is <strong>.
     * IMPORTANT: Do NOT use display:block on <strong> — it breaks inline
     * bold text in flowing paragraphs (e.g., "expertise in **Product Analytics**").
     * See: test_inline_formatting.py
     */
    p > strong:first-child {
      display: inline;
    }

    /* Italic text — commonly used for dates and locations in resumes */
    em {
      font-style: italic;
      color: #555;
    }

    /* Date/location right-alignment (DECOUPLED from bolding):
       resume_renderer.js tags a <p> as .entry-header when its LAST meaningful node
       is a trailing italic date/location. We float that italic right — regardless
       of bolding, and WITHOUT matching body prose that merely ends in "*italic*."
       (those paragraphs are NOT tagged).
       e.g. "Google · SWE · SF *Jan 2022 – Present*"  or  "**Lead** · X *2024*" */
    .entry-header > em:last-child {
      float: right;
    }

    /* Consecutive entry-lines (e.g. Education: school+date, degree+location):
       zero margin so spacing = line-height. Keyed on the .entry-header class
       (no :has — paged.js's selector engine rejects nested :has). */
    .entry-header + .entry-header {
      margin-top: 0;
    }

    table {
        width: 100%;
        border-collapse: collapse;
    }
    th, td {
        padding: 4px 8px;
        border: 1px solid transparent; 
    }

    /* Visual Page Break Line (Screen Only) */
    .page-break-line {
      position: absolute;
      left: 0;
      width: 100%;
      height: 2px;
      border-bottom: 2px dashed red;
      pointer-events: none;
      z-index: 50;
    }
    .page-break-label {
        position: absolute;
        right: 10px;
        top: -22px;
        color: red;
        font-weight: bold;
        background: rgba(255,255,255,0.9);
        padding: 2px 6px;
        border: 1px solid red;
        border-radius: 4px;
        font-size: 12px;
    }
    
    #page-count-indicator {
        position: fixed;
        top: 20px;
        left: 20px;
        background: rgba(33, 150, 243, 0.9);
        color: white;
        padding: 8px 16px;
        border-radius: 30px;
        font-weight: bold;
        z-index: 1000;
        font-size: 14px;
        box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        transition: all 0.3s;
    }



    /* Print Specifics - WYSIWYG */
    @media print {
      body {
        margin: 0;
        padding: 0;
        background: none;
        display: block;
      }
      #page-count-indicator {
          display: none;
      }
      .page {
        margin: 0;
        box-shadow: none;
        width: 100%;
        min-height: auto;
        padding: var(--page-margin, 0mm) !important; /* sentinel */
        border: none;
      }
      .page-break-line {
        display: none !important;
      }

      /* Paged.js output: make page boxes fill A4 with no extra outer margin */
      .pagedjs_page {
        margin: 0 !important;
        box-shadow: none !important;
      }
      .pagedjs_pagebox {
        margin: 0 !important;
        box-sizing: border-box;
      }
    }
  </style>
</head>
<body>

  <!-- Dynamic Page Count Indicator -->
  <div id="page-count-indicator">共 1 页</div>

  <!-- The Resume Page Container -->
  <div id="content" class="page">
    <p>正在加载简历内容...</p>
    <!-- Page breaks will be injected by JS -->
  </div>

  <!-- Dependencies -->
  <script src="js/markdown-it.min.js"></script>
  
  <!-- Config: defaults (git-tracked) + optional user overrides (gitignored) -->
  <script src="js/config.defaults.js"></script>
  <script src="js/config.js"></script>
  
  <!-- Paged.js Configuration -->
  <script>
    window.PagedConfig = { auto: false };
  </script>
  <!-- Paged.js & Renderer -->
  <script src="js/paged.polyfill.js"></script>
  <script src="js/resume_renderer.js"></script>

  <!-- 
    Note: @page rules are now managed by resume_renderer.js (ensureA4PageRule)
    to allow dynamic margin adjustment via CSS variable.
  -->

</body>
</html>
